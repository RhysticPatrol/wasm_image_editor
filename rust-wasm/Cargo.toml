[package]
name = "rust-wasm"
version = "0.1.0"
edition = "2021"
authors = ["RhysticPatrol"]
description = "WebAssembly Image Processing Module"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
image = "0.24"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[profile.release]
opt-level = 3
lto = true
